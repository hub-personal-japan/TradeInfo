name: update-site
on:
  schedule:
    - cron: "*/15 0-7 * * 1-5"   # 平日 9:00〜16:59(JST)に約15分ごと(GitHub側の遅延あり)
    - cron: "40 8 * * 1-5"       # 17:40(JST) 終値確定後
  workflow_dispatch:             # 手動実行
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd
      - name: データ取得とサイト生成
        run: |
          mkdir -p _site/data
          cp -r index.html assets events.json _site/
          OUT=_site/data python scripts/fetch_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
